services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: business_os
    ports:
      - '5432:5432'
    volumes:
      - business_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_os -d business_os']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://business_os:changeme@postgres:5432/business_os
    ports:
      - '4000:4000'

volumes:
  business_os_pgdata:
